<!DOCTYPE html>  
<html lang="ja">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>バイトシフト管理・希望提出アプリ</title>  
  <script src="https://cdn.tailwindcss.com"></script>  
  <style>  
    .closed-pattern {  
      background-color: #f1f5f9;  
      background-image: repeating-linear-gradient(45deg, #e2e8f0, #e2e8f0 4px, #f1f5f9 4px, #f1f5f9 8px);  
    }  
    @media print {  
      .no-print { display: none !important; }  
      body { background: white !important; padding: 0 !important; }  
      .print-area { border: none !important; box-shadow: none !important; }  
      @page { size: A4 landscape; margin: 8mm; }  
    }  
  </style>  
</head>  
<body class="bg-slate-100 text-slate-800 p-3 md:p-6 text-sm">  
  
  <!-- 保存中・同期中インジケーター -->  
  <div id="syncBadge" class="fixed bottom-4 right-4 bg-slate-900 text-white text-xs px-3 py-1.5 rounded-full shadow-lg flex items-center gap-2 opacity-0 transition-opacity z-50 pointer-events-none">  
    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>  
    <span id="syncText">保存中...</span>  
  </div>  
  
  <div class="max-w-7xl mx-auto space-y-4">  
    <!-- ヘッダー -->  
    <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-wrap items-center justify-between gap-3 no-print">  
      <div>  
        <h1 class="font-bold text-lg text-slate-900" id="headerTitle">シフト希望提出</h1>  
        <p class="text-xs text-slate-500" id="headerSub">15:00〜20:00(30分刻み)入り / クラウド同期対応</p>  
      </div>  
  
      <div class="flex items-center gap-2">  
        <button id="btnOpenLogin" onclick="openLoginModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">  
          🔒 管理者ログイン  
        </button>  
  
        <div id="adminNavGroup" class="hidden flex items-center gap-2">  
          <span class="bg-emerald-100 text-emerald-800 text-[11px] font-bold px-2.5 py-1 rounded-md">管理者ログイン中</span>  
          <button onclick="adminLogout()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-3 py-1.5 rounded-lg text-xs font-bold transition">  
            ログアウト  
          </button>  
        </div>  
      </div>  
    </header>  
  
    <!-- スタッフ画面 -->  
    <div id="staffView" class="max-w-xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">  
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">  
        <div>  
          <h2 class="font-bold text-base text-slate-900">シフト希望の入力</h2>  
          <p class="text-xs text-slate-500">出勤可能な入り時間（または休み希望）を選択してください</p>  
        </div>  
        <div class="flex items-center gap-2">  
          <span class="text-xs font-bold text-slate-700">お名前:</span>  
          <select id="staffSelect" onchange="renderStaffList()" class="border border-indigo-200 bg-indigo-50 text-indigo-900 rounded px-2.5 py-1 text-xs font-bold"></select>  
        </div>  
      </div>  
  
      <div id="staffDaysList" class="space-y-2 max-h-[500px] overflow-y-auto pr-1"></div>  
  
      <div class="pt-3 border-t border-slate-100 flex items-center justify-between">  
        <span class="text-xs text-emerald-600 font-bold flex items-center gap-1">☁️ クラウド自動保存</span>  
        <button onclick="copyLineFormat()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded-lg transition shadow-xs flex items-center gap-1.5">  
          📋 LINE送信用テキストをコピー  
        </button>  
      </div>  
    </div>  
  
    <!-- 管理者画面 -->  
    <div id="adminView" class="hidden space-y-4">  
      <!-- スタッフ管理パネル -->  
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3 no-print">  
        <div class="flex flex-wrap items-center justify-between gap-3">  
          <div class="flex items-center gap-2">  
            <span class="font-bold text-xs text-slate-700">👥 スタッフ登録:</span>  
            <input   
              type="text"   
              id="newStaffName"   
              placeholder="名前を入力（例: 山田）"   
              class="border border-slate-300 rounded px-2.5 py-1 text-xs w-44 focus:outline-none focus:ring-2 focus:ring-indigo-400"  
              onkeydown="if(event.key === 'Enter') addStaff()"  
            />  
            <button onclick="addStaff()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3 py-1 rounded transition">  
              ＋ 追加  
            </button>  
          </div>  
          <div class="flex items-center gap-3">  
            <span class="text-xs text-slate-400">登録中: <span id="staffCount" class="font-bold text-slate-700">0</span>名</span>  
            <button onclick="changePasswordPrompt()" class="text-xs text-indigo-600 hover:underline">🔑 パスワード変更</button>  
          </div>  
        </div>  
        <div class="flex flex-wrap items-center gap-1.5 pt-2 border-t border-slate-100" id="staffTagList"></div>  
      </div>  
  
      <!-- 設定コントロールバー -->  
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3 no-print">  
        <div class="flex flex-wrap items-center justify-between gap-3">  
          <div class="flex items-center gap-2">  
            <span class="font-bold text-xs text-slate-700">年月:</span>  
            <select id="selYear" onchange="changeDate()" class="border border-slate-300 rounded px-2 py-1 text-xs">  
              <option value="2026">2026年</option>  
              <option value="2027">2027年</option>  
            </select>  
            <select id="selMonth" onchange="changeDate()" class="border border-slate-300 rounded px-2 py-1 text-xs font-bold"></select>  
          </div>  
  
          <div class="flex items-center gap-1.5">  
            <span class="font-bold text-xs text-slate-700">定休日(曜日):</span>  
            <div id="weekdayButtons" class="flex gap-1"></div>  
          </div>  
  
          <div class="flex items-center gap-2">  
            <button onclick="autoAssign()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-xs transition">  
              ✨ 自動シフト割当  
            </button>  
            <button onclick="window.print()" class="bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold transition">  
              🖨️ A4印刷 / PDF  
            </button>  
          </div>  
        </div>  
  
        <div class="text-[11px] text-slate-500 bg-slate-50 p-2 rounded border border-slate-200 flex items-center justify-between">  
          <span>💡 <strong>日付の見出し（例: 5日(月)）をクリック</strong>すると、「通常 ⇄ 特別営業 ⇄ 臨時休業」を切替できます。</span>  
          <button onclick="resetExceptions()" class="text-rose-600 hover:underline">個別例外をリセット</button>  
        </div>  
      </div>  
  
      <!-- シフト表 -->  
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 print-area space-y-6">  
        <div>  
          <div class="font-bold text-xs text-slate-600 mb-1 px-1">【上段】 1日 〜 15日</div>  
          <div class="overflow-x-auto">  
            <table class="w-full border-collapse border border-slate-300 text-center text-xs" id="tableTopHalf"></table>  
          </div>  
        </div>  
  
        <div>  
          <div class="font-bold text-xs text-slate-600 mb-1 px-1">【下段】 16日 〜 月末</div>  
          <div class="overflow-x-auto">  
            <table class="w-full border-collapse border border-slate-300 text-center text-xs" id="tableBottomHalf"></table>  
          </div>  
        </div>  
      </div>  
    </div>  
  </div>  
  
  <!-- ログインモーダル -->  
  <div id="loginModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">  
    <div class="bg-white rounded-xl shadow-xl max-w-xs w-full p-5 space-y-4">  
      <div class="flex items-center justify-between border-b border-slate-100 pb-2">  
        <h3 class="font-bold text-slate-900 text-sm">🔒 管理者認証</h3>  
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-700 text-sm">✕</button>  
      </div>  
      <div>  
        <label class="block text-xs font-bold text-slate-600 mb-1">暗証番号</label>  
        <input type="password" id="pinInput" placeholder="暗証番号を入力" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-center text-lg font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-400" onkeydown="if(event.key === 'Enter') submitLogin()"/>  
        <p class="text-[11px] text-slate-400 mt-1 text-center">初期パスワード: 1234</p>  
      </div>  
      <div class="flex gap-2">  
        <button onclick="closeLoginModal()" class="flex-1 py-1.5 text-xs font-bold text-slate-600 bg-slate-100 rounded-lg">キャンセル</button>  
        <button onclick="submitLogin()" class="flex-1 py-1.5 text-xs font-bold text-white bg-slate-800 hover:bg-slate-900 rounded-lg">ログイン</button>  
      </div>  
    </div>  
  </div>  
  
  <!-- 入り時間選択モーダル -->  
  <div id="editModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">  
    <div class="bg-white rounded-xl shadow-xl max-w-xs w-full p-4 space-y-3">  
      <div class="flex items-center justify-between border-b border-slate-100 pb-2">  
        <div id="modalTitle" class="font-bold text-xs text-slate-800"></div>  
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-sm">✕</button>  
      </div>  
      <div id="timeButtonsGrid" class="grid grid-cols-3 gap-1.5"></div>  
      <div class="flex gap-2 pt-2 border-t border-slate-100">  
        <button onclick="setShiftValue('休み')" class="flex-1 py-1.5 text-xs font-bold text-amber-700 bg-amber-50 rounded border border-amber-200">休み</button>  
        <button onclick="setShiftValue('')" class="flex-1 py-1.5 text-xs font-bold text-slate-600 bg-slate-100 rounded">クリア</button>  
      </div>  
    </div>  
  </div>  
  
  <script>  
    // ==========================================  
    // ★ ここにステップ1で発行したURLを貼り付けます  
    // ==========================================  
    https://script.google.com/macros/s/AKfycbzhZF_FFdjS7TDegj33pnMPkgPZUe414S9eMkxB09yG62sX3kmgPQ5ZU4pJm2VuUYHL5A/exec  
  
    const ENTRY_TIMES = ['15:00', '15:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00'];  
    const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];  
    const HOLIDAYS = { '2026-11-03': '文化の日', '2026-11-23': '勤労感謝の日' };  
  
    let state = {  
      isAdmin: false,  
      adminPin: '1234',  
      year: 2026,  
      month: 11,  
      staff: ['佐藤', '鈴木', '高橋', '田中', '伊藤'],  
      currentStaff: '佐藤',  
      closedWeekdays: [1, 2],  
      dayExceptions: {},  
      shifts: {},  
      editingTarget: null  
    };  
  
    // ==========================================  
    // クラウド同期（読み込み ＆ 自動保存）  
    // ==========================================  
    async function loadCloudData() {  
      if (!GAS_API_URL || GAS_API_URL === 'YOUR_GAS_WEB_APP_URL') return;  
      showSyncIndicator('クラウドから最新データを取得中...');  
      try {  
        const res = await fetch(GAS_API_URL);  
        const data = await res.json();  
        if (data && Object.keys(data).length > 0) {  
          state.staff = data.staff || state.staff;  
          state.adminPin = data.adminPin || state.adminPin;  
          state.closedWeekdays = data.closedWeekdays || state.closedWeekdays;  
          state.dayExceptions = data.dayExceptions || state.dayExceptions;  
          state.shifts = data.shifts || state.shifts;  
          state.currentStaff = state.staff[0] || '';  
        }  
      } catch (err) {  
        console.error('読み込み失敗:', err);  
      } finally {  
        hideSyncIndicator();  
        renderStaffControls();  
        renderWeekdaysControl();  
        renderAll();  
      }  
    }  
  
    let saveTimer = null;  
    function triggerAutoSave() {  
      if (!GAS_API_URL || GAS_API_URL === 'YOUR_GAS_WEB_APP_URL') return;  
      clearTimeout(saveTimer);  
      showSyncIndicator('保存中...');  
      saveTimer = setTimeout(async () => {  
        try {  
          const payload = {  
            staff: state.staff,  
            adminPin: state.adminPin,  
            closedWeekdays: state.closedWeekdays,  
            dayExceptions: state.dayExceptions,  
            shifts: state.shifts  
          };  
          await fetch(GAS_API_URL, {  
            method: 'POST',  
            mode: 'no-cors', // GASとの安全なCORS通信  
            headers: { 'Content-Type': 'application/json' },  
            body: JSON.stringify(payload)  
          });  
          showSyncIndicator('クラウドに保存完了', true);  
        } catch (err) {  
          console.error('保存失敗:', err);  
          showSyncIndicator('保存エラー', true);  
        }  
      }, 500); // 入力後0.5秒待ってまとめて送信  
    }  
  
    function showSyncIndicator(text, fade = false) {  
      const badge = document.getElementById('syncBadge');  
      document.getElementById('syncText').textContent = text;  
      badge.classList.remove('opacity-0');  
      if (fade) {  
        setTimeout(() => badge.classList.add('opacity-0'), 1500);  
      }  
    }  
    function hideSyncIndicator() {  
      document.getElementById('syncBadge').classList.add('opacity-0');  
    }  
  
    // ==========================================  
    // アプリ初期化  
    // ==========================================  
    function init() {  
      const selMonth = document.getElementById('selMonth');  
      for (let m = 1; m <= 12; m++) {  
        const opt = document.createElement('option');  
        opt.value = m;  
        opt.textContent = `${m}月`;  
        if (m === state.month) opt.selected = true;  
        selMonth.appendChild(opt);  
      }  
  
      const grid = document.getElementById('timeButtonsGrid');  
      ENTRY_TIMES.forEach(t => {  
        const btn = document.createElement('button');  
        btn.className = "py-1.5 text-xs font-bold rounded border border-slate-200 bg-white hover:bg-indigo-50 hover:text-indigo-600 transition";  
        btn.textContent = t;  
        btn.onclick = () => setShiftValue(t);  
        grid.appendChild(btn);  
      });  
  
      renderStaffControls();  
      renderWeekdaysControl();  
      renderAll();  
      updateViewMode();  
      loadCloudData(); // 起動時に自動取得  
    }  
  
    // ==========================================  
    // 認証・画面切り替え  
    // ==========================================  
    function openLoginModal() {  
      document.getElementById('pinInput').value = '';  
      document.getElementById('loginModal').classList.remove('hidden');  
      setTimeout(() => document.getElementById('pinInput').focus(), 50);  
    }  
    function closeLoginModal() {  
      document.getElementById('loginModal').classList.add('hidden');  
    }  
    function submitLogin() {  
      const pin = document.getElementById('pinInput').value;  
      if (pin === state.adminPin) {  
        state.isAdmin = true;  
        closeLoginModal();  
        updateViewMode();  
      } else {  
        alert('暗証番号が正しくありません。');  
        document.getElementById('pinInput').value = '';  
        document.getElementById('pinInput').focus();  
      }  
    }  
    function adminLogout() {  
      state.isAdmin = false;  
      updateViewMode();  
    }  
    function changePasswordPrompt() {  
      const current = prompt('現在のパスワードを入力してください:');  
      if (current !== state.adminPin) return alert('パスワードが違います。');  
      const next = prompt('新しいパスワードを入力してください:');  
      if (!next) return;  
      state.adminPin = next;  
      triggerAutoSave();  
      alert('パスワードを変更・保存しました！');  
    }  
  
    function updateViewMode() {  
      document.getElementById('staffView').classList.toggle('hidden', state.isAdmin);  
      document.getElementById('adminView').classList.toggle('hidden', !state.isAdmin);  
      document.getElementById('btnOpenLogin').classList.toggle('hidden', state.isAdmin);  
      document.getElementById('adminNavGroup').classList.toggle('hidden', !state.isAdmin);  
      document.getElementById('headerTitle').textContent = state.isAdmin ? 'シフト作成・管理（管理者）' : 'シフト希望提出';  
    }  
  
    // ==========================================  
    // スタッフ管理  
    // ==========================================  
    function addStaff() {  
      const input = document.getElementById('newStaffName');  
      const name = input.value.trim();  
      if (!name) return;  
      if (state.staff.includes(name)) return alert('そのスタッフ名は既に登録されています。');  
      state.staff.push(name);  
      input.value = '';  
      renderStaffControls();  
      renderAll();  
      triggerAutoSave();  
    }  
  
    function deleteStaff(name) {  
      if (!confirm(`スタッフ「${name}」を削除してもよろしいですか？`)) return;  
      state.staff = state.staff.filter(s => s !== name);  
      Object.keys(state.shifts).forEach(k => {  
        if (k.startsWith(`${name}_`)) delete state.shifts[k];  
      });  
      if (state.currentStaff === name) state.currentStaff = state.staff[0] || '';  
      renderStaffControls();  
      renderAll();  
      triggerAutoSave();  
    }  
  
    function renderStaffControls() {  
      document.getElementById('staffCount').textContent = state.staff.length;  
      const container = document.getElementById('staffTagList');  
      container.innerHTML = '';  
      state.staff.forEach(name => {  
        const badge = document.createElement('span');  
        badge.className = "inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200";  
        badge.innerHTML = `<span>${name}</span><button onclick="deleteStaff('${name}')" class="text-slate-400 hover:text-rose-600 transition ml-1">✕</button>`;  
        container.appendChild(badge);  
      });  
  
      const staffSel = document.getElementById('staffSelect');  
      staffSel.innerHTML = '';  
      state.staff.forEach(s => {  
        const opt = document.createElement('option');  
        opt.value = s;  
        opt.textContent = s;  
        if (s === state.currentStaff) opt.selected = true;  
        staffSel.appendChild(opt);  
      });  
    }  
  
    // ==========================================  
    // カレンダー・テーブル描画  
    // ==========================================  
    function renderWeekdaysControl() {  
      const container = document.getElementById('weekdayButtons');  
      container.innerHTML = '';  
      WEEKDAYS.forEach((w, idx) => {  
        const btn = document.createElement('button');  
        const isClosed = state.closedWeekdays.includes(idx);  
        btn.className = `w-7 h-7 text-xs font-bold rounded border transition ${  
          isClosed ? 'bg-slate-700 text-white border-slate-700' : 'bg-white text-slate-700 border-slate-300'  
        }`;  
        btn.textContent = w;  
        btn.onclick = () => {  
          if (state.closedWeekdays.includes(idx)) {  
            state.closedWeekdays = state.closedWeekdays.filter(d => d !== idx);  
          } else {  
            state.closedWeekdays.push(idx);  
          }  
          renderWeekdaysControl();  
          renderAll();  
          triggerAutoSave();  
        };  
        container.appendChild(btn);  
      });  
    }  
  
    function getDays() {  
      const total = new Date(state.year, state.month, 0).getDate();  
      const list = [];  
      for (let d = 1; d <= total; d++) {  
        const dateKey = `${state.year}-${String(state.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;  
        const dow = new Date(state.year, state.month - 1, d).getDay();  
        const isWeekdayClosed = state.closedWeekdays.includes(dow);  
        const exc = state.dayExceptions[dateKey];  
        const isClosed = exc === 'open' ? false : (exc === 'closed' ? true : isWeekdayClosed);  
        const isHoliday = !!HOLIDAYS[dateKey];  
        list.push({ day: d, dow, dowName: WEEKDAYS[dow], dateKey, isClosed, isWeekdayClosed, exc, isHoliday });  
      }  
      return list;  
    }  
  
    function renderAll() {  
      const days = getDays();  
      renderTable('tableTopHalf', days.slice(0, 15));  
      renderTable('tableBottomHalf', days.slice(15));  
      renderStaffList();  
    }  
  
    function renderTable(tableId, days) {  
      const table = document.getElementById(tableId);  
      table.innerHTML = '';  
      if (state.staff.length === 0) {  
        table.innerHTML = '<tr><td class="p-4 text-slate-400">スタッフが登録されていません。</td></tr>';  
        return;  
      }  
  
      const thead = document.createElement('thead');  
      const headRow = document.createElement('tr');  
      headRow.className = "bg-slate-100";  
        
      const thStaff = document.createElement('th');  
      thStaff.className = "border border-slate-300 p-2 w-24 text-slate-700 font-bold bg-slate-200";  
      thStaff.textContent = "スタッフ";  
      headRow.appendChild(thStaff);  
  
      days.forEach(d => {  
        const th = document.createElement('th');  
        let bg = 'bg-slate-50 text-slate-700';  
        if (d.isClosed) bg = 'bg-slate-200 text-slate-500';  
        else if (d.exc === 'open') bg = 'bg-emerald-100 text-emerald-800 font-bold';  
        else if (d.dow === 0 || d.isHoliday) bg = 'bg-rose-100 text-rose-800';  
        else if (d.dow === 6) bg = 'bg-blue-100 text-blue-800';  
  
        th.className = `border border-slate-300 p-1 min-w-[50px] cursor-pointer hover:opacity-80 select-none ${bg}`;  
        th.title = "クリックで個別例外（営業/休業）を切替";  
        th.onclick = () => toggleDayException(d.dateKey, d.isWeekdayClosed);  
  
        let badge = '';  
        if (d.exc === 'open') badge = '<div class="text-[9px] text-emerald-700 font-bold">特別営</div>';  
        else if (d.isClosed) badge = `<div class="text-[9px] text-slate-500">${d.exc === 'closed' ? '臨時休' : '定休'}</div>`;  
  
        th.innerHTML = `<div>${d.day}日</div><div class="text-[10px]">(${d.dowName})</div>${badge}`;  
        headRow.appendChild(th);  
      });  
      thead.appendChild(headRow);  
      table.appendChild(thead);  
  
      const tbody = document.createElement('tbody');  
      state.staff.forEach(s => {  
        const tr = document.createElement('tr');  
        const tdName = document.createElement('td');  
        tdName.className = "border border-slate-300 p-1.5 font-bold bg-slate-50 whitespace-nowrap";  
        tdName.textContent = s;  
        tr.appendChild(tdName);  
  
        days.forEach(d => {  
          const td = document.createElement('td');  
          const val = state.shifts[`${s}_${d.dateKey}`] || '';  
  
          if (d.isClosed) {  
            td.className = "border border-slate-300 closed-pattern text-slate-400 select-none";  
            td.textContent = "-";  
          } else {  
            td.className = `border border-slate-300 p-1 cursor-pointer transition ${  
              val === '休み' ? 'bg-amber-50 text-amber-700 font-bold' :  
              val ? 'bg-indigo-50 text-indigo-700 font-bold' : 'hover:bg-indigo-50/50 text-slate-300'  
            }`;  
            td.textContent = val || '-';  
            td.onclick = () => openModal(s, d);  
          }  
          tr.appendChild(td);  
        });  
        tbody.appendChild(tr);  
      });  
      table.appendChild(tbody);  
    }  
  
    function toggleDayException(dateKey, isWeekdayClosed) {  
      const cur = state.dayExceptions[dateKey];  
      if (!cur) state.dayExceptions[dateKey] = isWeekdayClosed ? 'open' : 'closed';  
      else delete state.dayExceptions[dateKey];  
      renderAll();  
      triggerAutoSave();  
    }  
  
    function resetExceptions() {  
      state.dayExceptions = {};  
      renderAll();  
      triggerAutoSave();  
    }  
  
    function openModal(staff, d) {  
      state.editingTarget = { staff, dateKey: d.dateKey };  
      document.getElementById('modalTitle').textContent = `${staff} さん : ${d.day}日(${d.dowName})`;  
      document.getElementById('editModal').classList.remove('hidden');  
    }  
  
    function closeModal() {  
      document.getElementById('editModal').classList.add('hidden');  
      state.editingTarget = null;  
    }  
  
    function setShiftValue(val) {  
      if (!state.editingTarget) return;  
      const key = `${state.editingTarget.staff}_${state.editingTarget.dateKey}`;  
      if (!val) delete state.shifts[key];  
      else state.shifts[key] = val;  
      closeModal();  
      renderAll();  
      triggerAutoSave();  
    }  
  
    function autoAssign() {  
      if (state.staff.length === 0) return alert('スタッフが登録されていません。');  
      const days = getDays();  
      days.forEach(d => {  
        if (d.isClosed) return;  
        const count = (d.dow === 0 || d.dow === 6 || d.isHoliday) ? 3 : 2;  
        let assigned = 0;  
        const shuffled = [...state.staff].sort(() => 0.5 - Math.random());  
        shuffled.forEach((s, idx) => {  
          const key = `${s}_${d.dateKey}`;  
          if (assigned < count && !state.shifts[key]) {  
            state.shifts[key] = idx === 0 ? '16:00' : (idx === 1 ? '17:00' : '18:00');  
            assigned++;  
          }  
        });  
      });  
      renderAll();  
      triggerAutoSave();  
    }  
  
    // スタッフ提出画面  
    function renderStaffList() {  
      const staffSel = document.getElementById('staffSelect');  
      if (state.staff.length === 0) {  
        document.getElementById('staffDaysList').innerHTML = '<div class="p-4 text-center text-slate-400">スタッフが登録されていません</div>';  
        return;  
      }  
      state.currentStaff = staffSel.value || state.staff[0];  
      const list = document.getElementById('staffDaysList');  
      list.innerHTML = '';  
  
      const days = getDays();  
      days.forEach(d => {  
        const key = `${state.currentStaff}_${d.dateKey}`;  
        const curVal = state.shifts[key] || '';  
  
        const div = document.createElement('div');  
        div.className = `flex items-center justify-between p-2 rounded border text-xs ${  
          d.isClosed ? 'bg-slate-100 opacity-60 border-slate-200' : 'bg-white border-slate-200'  
        }`;  
  
        let label = `<div class="flex items-center gap-2">  
          <span class="font-bold w-6 text-right">${d.day}日</span>  
          <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${d.dow === 0 || d.isHoliday ? 'bg-rose-100 text-rose-700' : d.dow === 6 ? 'bg-blue-100 text-blue-700' : 'bg-slate-100'}">(${d.dowName})</span>  
          ${d.exc === 'open' ? '<span class="text-[9px] bg-emerald-100 text-emerald-800 px-1 rounded">特別営</span>' : ''}  
          ${d.isClosed ? '<span class="text-[9px] bg-slate-200 text-slate-600 px-1 rounded">休み</span>' : ''}  
        </div>`;  
  
        let action = '';  
        if (d.isClosed) {  
          action = `<span class="text-slate-400">店休</span>`;  
        } else {  
          let opts = `<option value="">未選択</option><option value="休み" ${curVal==='休み'?'selected':''}>✕ 休み希望</option>`;  
          ENTRY_TIMES.forEach(t => {  
            opts += `<option value="${t}" ${curVal===t?'selected':''}>${t} 入り</option>`;  
          });  
          action = `<select onchange="updateStaffShift('${d.dateKey}', this.value)" class="border border-slate-300 rounded px-2 py-1 text-xs font-bold ${curVal ? 'bg-indigo-50 text-indigo-700' : ''}">${opts}</select>`;  
        }  
  
        div.innerHTML = label + action;  
        list.appendChild(div);  
      });  
    }  
  
    function updateStaffShift(dateKey, val) {  
      const key = `${state.currentStaff}_${dateKey}`;  
      if (!val) delete state.shifts[key];  
      else state.shifts[key] = val;  
      renderAll();  
      triggerAutoSave();  
    }  
  
    function copyLineFormat() {  
      if (!state.currentStaff) return;  
      const days = getDays();  
      let text = `【シフト希望】${state.currentStaff} (${state.year}年${state.month}月)\n`;  
      days.forEach(d => {  
        if (d.isClosed) return;  
        const val = state.shifts[`${state.currentStaff}_${d.dateKey}`];  
        if (val) {  
          text += `${d.day}日(${d.dowName}): ${val === '休み' ? '休み' : val + '入り'}\n`;  
        }  
      });  
      navigator.clipboard.writeText(text);  
      alert('LINE用テキストをコピーしました！トーク画面に貼り付けられます。');  
    }  
  
    function changeDate() {  
      state.year = Number(document.getElementById('selYear').value);  
      state.month = Number(document.getElementById('selMonth').value);  
      renderAll();  
    }  
  
    window.onload = init;  
  </script>  
</body>  
</html>
